name: idaes-process
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - matplotlib>=3.7
  - pillow>=9.0
  - pypdf>=3.0
  - poppler
  - pyyaml>=6.0
  - pytest>=7.0
  - pyomo>=6.7
  - idaes-pse>=2.8
  - ipopt
  - pip

# IDAES extension binaries are version/platform dependent. After activation,
# run: idaes get-extensions
# Optional HPC extras (install only on the target Linux environment): petsc4py,
# mpi4py, highs, and an HSL build such as MA57 when licensed/available.

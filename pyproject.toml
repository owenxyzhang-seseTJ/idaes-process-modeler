[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idaes-process-modeler"
version = "0.1.0"
description = "Auditable IDAES/Pyomo-oriented chemical process modeling workflows."
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "pandas>=1.4",
  "matplotlib>=3.5",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
idaes = ["pyomo>=6.7", "idaes-pse>=2.8"]
all = ["pytest>=7.0", "pyomo>=6.7", "idaes-pse>=2.8"]

[project.scripts]
idaes-model = "idaes_process_modeler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

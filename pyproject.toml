[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "idaes-process-modeler"
version = "0.1.0"
description = "Auditable IDAES/Pyomo-oriented chemical process modeling workflows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xiaoyu Zhang", email = "owenxyzhang@gmail.com" }]
keywords = [
  "IDAES", "Pyomo", "process-modeling", "adsorption", "PSA", "VSA", "TSA",
  "membrane-separation", "parameter-estimation", "chemical-engineering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "pandas>=1.4",
  "matplotlib>=3.5",
  "pillow>=9.0",
  "pypdf>=3.0",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
idaes = ["pyomo>=6.7", "idaes-pse>=2.8"]
all = ["pytest>=7.0", "pyomo>=6.7", "idaes-pse>=2.8"]

[project.scripts]
idaes-model = "idaes_process_modeler.cli:main"

[project.urls]
Homepage = "https://github.com/owenxyzhang-seseTJ/idaes-process-modeler"
Repository = "https://github.com/owenxyzhang-seseTJ/idaes-process-modeler"
Issues = "https://github.com/owenxyzhang-seseTJ/idaes-process-modeler/issues"
Changelog = "https://github.com/owenxyzhang-seseTJ/idaes-process-modeler/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
